spring.application.name=neighbor-sharing-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/neighbor_sharing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Custom Configuration
app.jwt.secret=change-this-secret-to-at-least-32-chars-for-production
app.jwt.expire-seconds=7200
app.upload.path=d:/ai练/fast/backend/demo/uploads
app.upload.url-prefix=/uploads

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.neighbor=DEBUG
